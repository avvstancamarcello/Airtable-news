name: Public Dossier

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish_dossier]
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: public-dossier
  cancel-in-progress: false

jobs:
  fetch-dossier:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test scripts/fetch-dossier.test.mjs
      - name: Fetch Archivio Dossier da Airtable
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_DOSSIER_TABLE_ID: tblNgUA368TzwLuZ7
          OUTPUT_FILE: data/dossier.json
        run: node scripts/fetch-dossier.mjs
      - name: Commit del JSON solo se cambiato
        run: |
          git add -- data/dossier.json
          if git diff --cached --quiet -- data/dossier.json; then
            echo "Nessuna modifica."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna dossier.json da Airtable" -- data/dossier.json
          git push origin HEAD:main
