name: Publish Airtable news

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/publish-news.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/publish-news.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test scripts/export-news.test.mjs

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-news-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Export and validate
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: node scripts/export-news.mjs news.json
      - name: Commit valid feed only when changed
        run: |
          git add -- news.json
          if git diff --cached --quiet -- news.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update news.json from Airtable" -- news.json
          git push origin HEAD:main
